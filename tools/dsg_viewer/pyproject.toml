[project]
name = "dsg-viewer"
version = "0.1.0"
description = "Qt viewer for Hydra 3D scene graphs (dsg.json) with mesh, trajectory, objects and recorded observations"
requires-python = ">=3.12,<3.13"
dependencies = [
  "matplotlib==3.11.2",
  "numpy==2.1.3",
  "pillow==13.0.0",
  "PySide6==6.8.1",
  "vtk==9.3.1",
  "pyvista==0.44.2",
  "pyvistaqt==0.11.1",
  "qtpy==2.4.2",
]

[project.scripts]
dsg-viewer = "dsg_viewer.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["dsg_viewer"]
